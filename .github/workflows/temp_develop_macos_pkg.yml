# TEMPORARY: Remove this workflow before opening the pull request.
name: "TEMP: develop macOS PKG"

on:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: temp-develop-macos-pkg
  cancel-in-progress: true

env:
  APP_NAME: superseedr

jobs:
  build_standard_pkg:
    name: Build standard universal PKG
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      KEYCHAIN_NAME: build.keychain
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-temp-develop-macos-pkg-${{ hashFiles('**/Cargo.lock') }}

      - name: Pre-compile universal Rust binaries
        run: |
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin

      - name: Set up signing keychain
        env:
          APPLE_INSTALLER_CERT_P12_BASE64: ${{ secrets.APPLE_INSTALLER_CERT_P12_BASE64 }}
          APPLE_INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERT_PASSWORD }}
        run: |
          security create-keychain -p "$RUNNER_TEMP" "$KEYCHAIN_NAME"
          security list-keychains -s "$KEYCHAIN_NAME"
          security default-keychain -s "$KEYCHAIN_NAME"
          security unlock-keychain -p "$RUNNER_TEMP" "$KEYCHAIN_NAME"

          printf '%s' "$APPLE_INSTALLER_CERT_P12_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 \
            -k "$KEYCHAIN_NAME" \
            -P "$APPLE_INSTALLER_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign
          rm certificate.p12

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$RUNNER_TEMP" \
            "$KEYCHAIN_NAME"

          CERT_CN=$(security find-identity -v "$KEYCHAIN_NAME" | grep "Developer ID Installer" | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$CERT_CN" ]; then
            echo "::error::No Developer ID Installer identity was found."
            exit 1
          fi
          echo "CERT_NAME=$CERT_CN" >> "$GITHUB_ENV"

      - name: Build signed standard package
        id: build_pkg
        run: |
          set -o pipefail
          PACKAGE_VERSION="0.0.${{ github.run_number }}"

          scripts/build_osx_universal_pkg.sh \
            "$PACKAGE_VERSION" \
            normal \
            "${{ env.CERT_NAME }}" \
            2>&1 | tee build_log.txt

          PKG_PATH=$(grep 'PKG_PATH=' build_log.txt | head -n 1 | sed -n 's/.*PKG_PATH=\(.*\)/\1/p' | tr -d '[:space:]')
          if [ -z "$PKG_PATH" ] || [ ! -f "$PKG_PATH" ]; then
            echo "::error::The package build did not produce a PKG artifact."
            exit 1
          fi
          echo "pkg_path=$PKG_PATH" >> "$GITHUB_OUTPUT"

      - name: Notarize and staple package
        env:
          APPLE_NOTARY_USERNAME: ${{ secrets.APPLE_NOTARY_USERNAME }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          PKG_PATH="${{ steps.build_pkg.outputs.pkg_path }}"
          xcrun notarytool submit "$PKG_PATH" \
            --apple-id "$APPLE_NOTARY_USERNAME" \
            --password "$APPLE_NOTARY_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$PKG_PATH"

      - name: Verify and stage package
        id: stage_pkg
        run: |
          PKG_PATH="${{ steps.build_pkg.outputs.pkg_path }}"
          pkgutil --check-signature "$PKG_PATH"
          spctl --assess --type install --verbose=4 "$PKG_PATH"

          SHORT_SHA=$(printf '%s' "${{ github.sha }}" | cut -c1-7)
          FINAL_PATH="staging/${APP_NAME}-develop-${SHORT_SHA}-universal-macos.pkg"
          mkdir -p staging
          mv "$PKG_PATH" "$FINAL_PATH"
          shasum -a 256 "$FINAL_PATH" | tee staging/SHA256SUMS
          echo "final_pkg_path=$FINAL_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload test package
        uses: actions/upload-artifact@v7
        with:
          name: superseedr-develop-standard-macos-${{ github.sha }}
          path: |
            ${{ steps.stage_pkg.outputs.final_pkg_path }}
            staging/SHA256SUMS
          retention-days: 7

      - name: Clean up signing keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_NAME" || true
